plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.jingcai'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.jingcai"
        minSdk 24
        targetSdk 34
        versionCode 22
        versionName "1.22"
    }

    buildFeatures {
        compose true
    }

    buildTypes {
        release {
            // 开 R8：只为了 5 个底部图标就引入 material-icons-extended 那种「整包膨胀」
            // 是反面教材，但项目本身也确实一直在带着全部未使用的代码发布。
            // 规则见 proguard-rules.pro —— 🔴 data 包必须整包 keep（Gson 反射靠字段名）。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 沿用 debug 签名：本项目的安装包历来用 debug keystore 签，
            // 换成新 keystore 会导致「覆盖安装失败，必须先卸载」（注单/关注全丢）。
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    // 进程级生命周期（App 前/后台）——进球提醒需要判断「用户是否还在 App 里」
    implementation 'androidx.lifecycle:lifecycle-process:2.7.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jsoup:jsoup:1.17.2'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
